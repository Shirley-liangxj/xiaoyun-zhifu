<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小云智服 · 注册</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F0F4F8;color:#1F2937;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{width:400px;background:#fff;border-radius:16px;padding:40px 36px;box-shadow:0 4px 24px rgba(31,41,55,0.08)}
  .logo{width:56px;height:56px;background:linear-gradient(135deg,#1D9E75,#0F6E56);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
  h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
  .subtitle{text-align:center;font-size:13px;color:#6B7280;margin-bottom:28px}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  .form-group input{width:100%;height:42px;border:1px solid #D1D5DB;border-radius:8px;padding:0 14px;font-size:14px;outline:none;transition:border-color .2s}
  .form-group input:focus{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,0.12)}
  .btn-primary{width:100%;height:44px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s}
  .btn-primary:hover{background:#0F6E56}
  .footer{text-align:center;font-size:13px;color:#6B7280;margin-top:16px}
  .footer a{color:#1D9E75;text-decoration:none;font-weight:600}
  .tips{background:#E1F5EE;border-radius:8px;padding:12px 14px;font-size:12px;color:#0F6E56;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">☁️</div>
  <h1>注册小云智服</h1>
  <p class="subtitle">面向中小服饰电商的AI售后客服</p>
  <div class="form-group">
    <label>公司/店铺名称</label>
    <input type="text" placeholder="请输入店铺名称" value="云裳服饰">
  </div>
  <div class="form-group">
    <label>邮箱</label>
    <input type="email" placeholder="请输入邮箱地址">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" placeholder="至少6位字符">
  </div>
  <div class="form-group">
    <label>确认密码</label>
    <input type="password" placeholder="再次输入密码">
  </div>
  <button class="btn-primary">注册账号</button>
  <div class="tips">💡 注册即送免费版：每月100次问答，1个知识库。专业版¥299/月起。</div>
  <div class="footer">已有账号？<a href="03_登录页.html">立即登录</a></div>
</div>
</body>
</html>
