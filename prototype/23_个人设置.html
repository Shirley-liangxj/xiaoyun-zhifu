<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小云智服 · 个人设置</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F0F4F8;color:#1F2937;min-height:100vh;display:flex}
  .sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:#1F2937;z-index:100;display:flex;flex-direction:column}
  .sidebar-brand{padding:24px 20px 28px}
  .sidebar-brand h1{color:#fff;font-size:20px;font-weight:700}
  .sidebar-brand p{color:#9CA3AF;font-size:12px;margin-top:4px}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;color:#D1D5DB;cursor:pointer;text-decoration:none}
  .sidebar-nav a:hover{background:rgba(255,255,255,0.06);color:#fff}
  .sidebar-nav a.active{background:#1D9E75;color:#fff;border-left:3px solid #5DCAA5}
  .main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar h2{font-size:18px;font-weight:700}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#6B7280}
  .avatar{width:32px;height:32px;border-radius:50%;background:#1D9E75;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .content{padding:24px;max-width:720px}
  .card{background:#fff;border-radius:12px;border:1px solid #E5E7EB;margin-bottom:16px;overflow:hidden}
  .card-head{padding:16px 20px;border-bottom:1px solid #F0F4F8}
  .card-head h3{font-size:15px;font-weight:600}
  .card-body{padding:20px}
  .profile-row{display:flex;align-items:center;gap:20px;margin-bottom:20px}
  .profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1D9E75,#0F6E56);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
  .profile-info h4{font-size:16px;font-weight:600;margin-bottom:4px}
  .profile-info p{font-size:13px;color:#6B7280}
  .change-avatar{font-size:13px;color:#1D9E75;cursor:pointer;margin-top:6px}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  .form-group input,.form-group select{width:100%;height:40px;border:1px solid #D1D5DB;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
  .form-group input:focus,.form-group select:focus{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,0.12)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
  .btn-primary{background:#1D9E75;color:#fff}
  .btn-primary:hover{background:#0F6E56}
  .danger-zone{border:1px solid #FECACA}
  .danger-zone .card-head{background:#FEF2F2;color:#DC2626}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><h1>☁️ 小云智服</h1><p>AI售后客服管理台</p></div>
  <nav class="sidebar-nav">
    <a>📊 数据总览</a>
    <a>💬 会话管理</a>
    <a>📋 工单中心</a>
    <a>📚 知识库</a>
    <a>⚡ 快捷话术</a>
    <a>📈 AI效果分析</a>
    <a class="active">⚙️ 系统设置</a>
  </nav>
</div>
<div class="main">
  <div class="topbar"><h2>个人设置</h2><div class="topbar-right"><span>云裳服饰</span><div class="avatar">云</div></div></div>
  <div class="content">
    <div class="card">
      <div class="card-head"><h3>基本信息</h3></div>
      <div class="card-body">
        <div class="profile-row">
          <div class="profile-avatar">云</div>
          <div class="profile-info">
            <h4>云裳服饰</h4>
            <p>管理员 · 2026年6月加入</p>
            <span class="change-avatar">更换头像</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>店铺名称</label><input type="text" value="云裳服饰旗舰店"></div>
          <div class="form-group"><label>联系人</label><input type="text" value="梁雪洁"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>邮箱</label><input type="email" value="admin@yunshang.com"></div>
          <div class="form-group"><label>手机号</label><input type="tel" value="138****8888"></div>
        </div>
        <div class="form-group"><label>店铺类目</label><select><option>服饰鞋包</option><option>美妆个护</option><option>食品生鲜</option><option>家居日用</option></select></div>
        <button class="btn btn-primary">保存修改</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>修改密码</h3></div>
      <div class="card-body">
        <div class="form-group"><label>当前密码</label><input type="password" placeholder="请输入当前密码"></div>
        <div class="form-row">
          <div class="form-group"><label>新密码</label><input type="password" placeholder="至少6位字符"></div>
          <div class="form-group"><label>确认新密码</label><input type="password" placeholder="再次输入新密码"></div>
        </div>
        <button class="btn btn-primary">更新密码</button>
      </div>
    </div>
    <div class="card danger-zone">
      <div class="card-head"><h3>危险操作</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:#6B7280;margin-bottom:14px">注销账号后，所有数据将被永久删除且无法恢复。</p>
        <button class="btn" style="background:#fff;border:1px solid #FECACA;color:#DC2626">注销账号</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
